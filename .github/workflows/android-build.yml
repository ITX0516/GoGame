name: Android Build & Package

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      leelaz_binary_url:
        description: 'Custom leelaz binary download URL (optional)'
        required: false
        default: ''
      weights_url:
        description: 'Custom network weights download URL (optional)'
        required: false
        default: ''

jobs:
  build:
    name: Build APK with Leela Zero
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create assets directory
        run: mkdir -p app/src/main/assets

      - name: Download Leela Zero binary (ARM64 Android)
        run: |
          cd app/src/main/assets

          CUSTOM_URL="${{ github.event.inputs.leelaz_binary_url }}"
          SECRET_URL="${LEELAZ_BINARY_URL:-}"

          BINARY_URL=""
          if [ -n "$CUSTOM_URL" ]; then
            BINARY_URL="$CUSTOM_URL"
          elif [ -n "$SECRET_URL" ]; then
            BINARY_URL="$SECRET_URL"
          fi

          if [ -z "$BINARY_URL" ]; then
            echo "⚠️  No leelaz binary URL provided."
            echo "   Build will proceed WITHOUT AI engine."
            echo "   To add AI, set LEELAZ_BINARY_URL secret or provide URL via workflow_dispatch."
            exit 0
          fi

          echo "Downloading leelaz binary..."
          curl -sL -o leelaz "$BINARY_URL"

          # 验证：检查文件大小 (> 100KB 才算有效二进制)
          SIZE=$(stat -c%s leelaz 2>/dev/null || echo 0)
          echo "Downloaded size: $SIZE bytes"

          if [ "$SIZE" -gt 102400 ]; then
            chmod +x leelaz
            echo "✅ leelaz binary downloaded OK ($SIZE bytes)"
            file leelaz
          else
            echo "⚠️  Download seems too small ($SIZE bytes), removing..."
            rm -f leelaz
            echo "   Build will proceed WITHOUT AI engine."
          fi

      - name: Download Leela Zero network weights
        run: |
          cd app/src/main/assets

          CUSTOM_URL="${{ github.event.inputs.weights_url }}"

          # 默认使用 Leela Zero 官方 15b 权重
          DEFAULT_WEIGHTS="https://zero.sjeng.org/networks/15b/1145460e22f0f47c4667958b995fbd4f4ea6e4ba01548cd5f6d4f17683f9c29e.gz"

          WEIGHTS_URL="${CUSTOM_URL:-$DEFAULT_WEIGHTS}"

          echo "Downloading network weights..."
          echo "URL: $WEIGHTS_URL"
          curl -sL -o lz_network.gz "$WEIGHTS_URL"

          # 验证：检查是否为 gzip 格式（检查 magic number: 1f 8b）
          if file lz_network.gz | grep -q "gzip compressed"; then
            SIZE=$(stat -c%s lz_network.gz 2>/dev/null || echo 0)
            echo "✅ Weights downloaded OK ($SIZE bytes, gzip format)"

            # 重命名为 .lz 后缀，避免 Android aapt 自动解压 .gz 文件
            mv lz_network.gz lz_network.lz
            echo "Renamed to lz_network.lz (avoids aapt auto-extraction)"
          else
            echo "⚠️  Weights download failed or not a gzip file"
            file lz_network.gz
            head -c 100 lz_network.gz | hexdump -C | head -5
            rm -f lz_network.gz
            echo "   Build will proceed WITHOUT network weights."
          fi

      - name: List assets directory
        run: |
          echo "=== Assets contents ==="
          ls -lh app/src/main/assets/
          echo "======================="

      - name: Download Gradle Wrapper JAR
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -sL -o gradle/wrapper/gradle-wrapper.jar \
              "https://github.com/gradle/gradle/raw/v8.2.0/gradle/wrapper/gradle-wrapper.jar"
          fi

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Verify APK contents
        run: |
          APK_FILE=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "APK file: $APK_FILE"
          echo "APK size: $(du -h "$APK_FILE" | cut -f1)"
          echo ""
          echo "=== Assets in APK ==="
          unzip -l "$APK_FILE" | grep "assets/" || echo "(no assets listed)"
          echo "====================="

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GoGame-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: GoGame-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Build Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            build/reports/
          if-no-files-found: warn
          retention-days: 7
